name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the running workflow obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in package.json, Node from .nvmrc.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # postinstall builds packages/shared, which the API and web app import.
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  test:
    name: Tests with coverage gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # No services needed: the API's full-stack tests run on in-memory and temp-file stores.
      - name: Shared package (100% coverage enforced)
        run: pnpm --filter @payment-sim/shared test:cov
      - name: API unit + full-stack tests (90/80/90/90 coverage enforced)
        run: pnpm --filter @payment-sim/api test:cov
      - name: Web unit + component tests
        run: pnpm --filter @payment-sim/web test

      - name: Upload API coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage
          path: apps/api/coverage
          if-no-files-found: ignore
          retention-days: 14
