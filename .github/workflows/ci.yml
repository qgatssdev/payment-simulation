name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the running workflow obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in package.json, Node from .nvmrc.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # postinstall builds packages/shared, which the API and web app import.
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

      - name: Shared package tests (100% coverage enforced)
        run: pnpm --filter @payment-sim/shared test:cov

  test:
    name: API tests (unit + integration on Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payments_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d payments_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The suite refuses any database whose name does not end in _test.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payments_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Unit + integration tests with merged coverage thresholds
        run: pnpm --filter @payment-sim/api test:all

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage
          path: apps/api/coverage/all
          if-no-files-found: ignore
          retention-days: 14
